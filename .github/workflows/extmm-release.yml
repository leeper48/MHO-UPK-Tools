# Release of MHO Extended Mod Manager, built from source on GitHub.
# Push a tag extmm-v<version> (the version in MhoExtendedModManager.csproj) to run it:
#   git tag -a extmm-v0.21.1 -m "What changed ..."   then   git push origin extmm-v0.21.1
# Result: a DRAFT GitHub release with the zip, the Setup.exe and their .sha256 files, and the tag message as notes.
# Then sign it on Kurt's PC (the private key never goes to GitHub): download the zip, run
#   MHO_Ext_ModManager.exe --sign-file <zip> <release key .pem>, upload the .zip.sig to the draft, and publish.
# The app's updater ignores drafts, and offers only releases with a valid signature.
# The builds are not code-signed (Kurt's decision, 2026-09-27); README.txt tells users how to check a download.
name: MHO Extended Mod Manager release

on:
  push:
    tags: ['extmm-v*']

permissions:
  contents: write   # create the draft release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # MhoPackageModifier (leeper48/MHO-Package-Modifier), which the Mod Manager references

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The tag name reaches scripts through an environment variable, never pasted into the script text (script injection).
      - name: Version from the tag
        id: v
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^extmm-v[0-9]+(\.[0-9]+){1,3}$') { throw "unexpected tag name $tag" }
          $ver = $tag -replace '^extmm-v', ''
          $csproj = ([xml](Get-Content MhoExtendedModManager/MhoExtendedModManager.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($ver -ne $csproj) { throw "tag $tag doesn't match the csproj version $csproj" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      # Inno Setup 6.7.3, pinned: the official installer (signed by Pyrsys B.V.), installed only if its SHA-256 matches.
      - name: Install Inno Setup
        shell: pwsh
        timeout-minutes: 10
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $want = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest $url -OutFile innosetup.exe
          $got = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "Inno Setup installer SHA-256 is $got, expected $want" }
          # Per-user (no admin, no install-mode question) into the folder make_release.ps1 looks in. Waits for the installer
          # itself only (Start-Process -Wait also waited for what it left running and never returned); the log on failure.
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6'; $log = Join-Path $PWD 'innosetup.log'
          $p = Start-Process .\innosetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=`"$dir`"","/LOG=`"$log`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Get-Content $log -Tail 30 -ErrorAction SilentlyContinue; throw 'Inno Setup install timed out' }
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { Get-Content $log -Tail 30 -ErrorAction SilentlyContinue; throw "Inno Setup did not install (exit $($p.ExitCode))" }

      - name: Build the zip and the installer
        shell: pwsh
        run: ./MhoExtendedModManager/make_release.ps1 -Out out/release

      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          $v = $env:VERSION
          $files = Get-ChildItem out/release -File | Where-Object { $_.Name -like "MHO_Ext_ModManager-$v*" } | ForEach-Object { $_.FullName }
          gh release create $env:TAG @files --draft --title "MHO Extended Mod Manager $v" --notes-from-tag
          # Then, on Kurt's PC: download the zip, --sign-file it with the release key, upload the .sig, and publish.
          # The app offers only releases with a valid .sig (ReleaseSigning.cs).
